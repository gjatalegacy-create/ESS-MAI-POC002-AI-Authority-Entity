[package]
name = "shadow_contracts"
version = "1.7.8"
edition = "2021"
authors = ["Bledar Gjata <gjata@legacy.al>"]
description = "AIGovern-Cyber public wire contracts for mediated Shadow process communication"

[lib]
name = "shadow_contracts"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
# R15: the architect's D-BAB/0-NOI operators digest typed structs through
# serde_json; these are the versions already locked by the workspace.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# future compiler warnings fail the build; no lint suppression.
[lints]
workspace = true
